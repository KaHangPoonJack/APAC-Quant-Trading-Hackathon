# Alembic configuration for the roostoo_compet trade-record DB.
[alembic]
script_location = store/migrations
prepend_sys_path = .
# Dev database. The app itself builds the URL via store.db; this is only used by
# the alembic CLI for generating/applying migrations.
sqlalchemy.url = sqlite:///data/roostoo_compet.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
